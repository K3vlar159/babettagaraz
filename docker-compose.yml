name: babettagaraz
services:
  postgres:
    image: postgres:16
    container_name: babettagaraz-db
    environment:
      POSTGRES_DB: babettagaraz
      POSTGRES_USER: babetta
      POSTGRES_PASSWORD: babetta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: